  * { box-sizing: border-box; }
  html, body {
    min-width: 1100px;
  }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #e9e9e9;
    margin: 0;
    padding: 0;
    color: #000;
  }

  /* ===== TOOLBAR ===== */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    min-width: 1100px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    padding: 10px 14px;
    background: #111827;
    color: #fff;
    box-shadow: 0 3px 14px rgba(0,0,0,.25);
  }
  .toolbar-title {
    font-weight: 700;
    margin-right: auto;
    white-space: nowrap;
  }
  .toolbar button,
  .toolbar select {
    height: 34px;
    border: 0;
    border-radius: 5px;
    padding: 0 10px;
    font: inherit;
  }
  .toolbar button { cursor: pointer; font-weight: 700; }
  .btn-blue { background:#2563eb; color:#fff; }
  .btn-green { background:#16a34a; color:#fff; }
  .btn-white { background:#fff; color:#111; }
  .btn-amber { background:#f59e0b; color:#111; }
  .btn-red { background:#dc2626; color:#fff; }
  .saved-wrap {
    display: flex;
    gap: 5px;
    padding: 4px;
    border-radius: 6px;
    background: rgba(255,255,255,.08);
  }
  .saved-wrap select { min-width: 210px; }
  .status { font-size: 12px; color:#cbd5e1; }

  /* ===== PAGE ===== */
  .page {
    width: 210mm;
    background: #fff;
    margin: 18px auto 28px;
    padding: 12mm 10mm;
    box-shadow: 0 6px 28px rgba(0,0,0,.16);
  }

  .kwitansi {
    border: 0;
    padding-bottom: 10mm;
  }
  .kwitansi + .kwitansi {
    margin-top: 10mm;
    padding-top: 10mm;
    border-top: 1px dashed #999;
  }

  /* ===== HEADER ===== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
  }

  .company-info {
    text-align: center;
    flex: 0 0 44%;
    min-width: 0;
  }

  .editable-text {
    outline: none;
    border-radius: 2px;
    padding: 1px 2px;
  }
  .editable-text:focus {
    background: #fff4b8;
    box-shadow: inset 0 0 0 1px #d3aa00;
  }

  .company-info .company-name {
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 0.3px;
  }
  .company-info .provide-by { font-size: 10.5px; }
  .company-info .address,
  .company-info .contact {
    font-size: 10px;
    margin-top: 2px;
  }

  .logo-wrap {
    flex: 0 0 22%;
    min-width: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .logo-wrap img {
    max-width: 140px;
    max-height: 70px;
    height: auto;
    object-fit: contain;
  }

  .form-fields {
    flex: 0 0 34%;
    min-width: 0;
    font-size: 11px;
    padding-top: 4px;
  }
  .form-fields .field-row {
    display: flex;
    margin-bottom: 4px;
    align-items: flex-end;
    width: 100%;
    min-width: 0;
  }
  .form-fields .field-label {
    flex: 0 0 74px;
    font-weight: bold;
    white-space: nowrap;
  }
  .form-fields .field-colon {
    flex: 0 0 10px;
    text-align: center;
  }
  .field-input {
    border: 0;
    border-bottom: 1px solid #000;

    background: transparent;
    height: 18px;
    padding: 0 2px;

  .form-fields .field-input {
    flex: 1 1 0;
    min-width: 0;
    width: 0;
  }
  .field-input:focus,
  .cell-input:focus,
  .summary-input:focus,
  .signature-name:focus {
    background:#fff4b8;
    box-shadow: inset 0 0 0 1px #d3aa00;
  }

  /* ===== TITLE BAR ===== */
  .title-bar {
    background: #000;
    color: #fff;
    text-align: center;
    font-weight: bold;
    font-size: 20px;
    letter-spacing: 6px;
    padding: 6px 0;
    margin-top: 14px;
    text-transform: uppercase;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .title-bar:focus {
    background: #111827 !important;
    color: #fff !important;
    box-shadow: inset 0 0 0 2px #3b82f6 !important;
  }

  /* ===== ROW ACTIONS ===== */
  .row-toolbar {
    display:flex;
    justify-content:flex-end;
    gap:6px;
    margin-top:8px;
  }
  .row-toolbar button {
    border:0;
    border-radius:4px;
    padding:5px 8px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
  }
  .add-row { background:#dbeafe; color:#1e3a8a; }
  .clear-rows { background:#fee2e2; color:#991b1b; }

  /* ===== TABLE ===== */
  table.items {
    width: 100%;
    border-collapse: collapse;
    margin-top: 5px;
    font-size: 11px;
    table-layout: fixed;
  }
  table.items th, table.items td {
    border: 1px solid #000;
  }
  table.items th {
    background: #fff;
    padding: 6px 4px;
    text-align: center;
    font-weight: bold;
  }
  table.items td {
    padding: 0;
    height: 26px;
  }
  table.items col.no { width: 6%; }
  table.items col.uraian { width: 39%; }
  table.items col.qty { width: 10%; }
  table.items col.harga { width: 18%; }
  table.items col.total { width: 20%; }
  table.items col.aksi { width: 7%; }

  .cell-input {
    width:100%;
    height:100%;
    border:0;
    outline:0;
    background:transparent;
    padding:4px;
    font:inherit;
  }
  .num { text-align:right; }
  .center { text-align:center; }

  .delete-row {
    display:block;
    margin:auto;
    border:0;
    border-radius:4px;
    background:#fee2e2;
    color:#991b1b;
    font-weight:700;
    font-size:10px;
    padding:4px 6px;
    cursor:pointer;
  }

  /* ===== SUMMARY ===== */
  .bottom-strip {
    display: flex;
    border-left: 1px solid #000;
    border-right: 1px solid #000;
    border-bottom: 1px solid #000;
  }
  .bottom-strip .blank-box {
    flex: 0 0 60%;
    border-right: 1px solid #000;
  }
  .bottom-strip .summary-box { flex: 1; }

  .summary-box table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }
  .summary-box td {
    padding: 3px 6px;
    height: 25px;
  }
  .summary-box td.label {
    text-align: right;
    width: 60%;
  }
  .summary-box td.value {
    border-left: 1px solid #000;
    width: 40%;
    padding:0;
  }
  .summary-box tr + tr td { border-top: 1px solid #000; }

  .summary-input {
    width:100%;
    height:100%;
    border:0;
    outline:0;
    background:transparent;
    text-align:right;
    padding:2px 5px;
    font:inherit;
  }
  .percent {
    width:42px;
    border:0;
    border-bottom:1px dotted #555;
    text-align:center;
    outline:0;
    background:transparent;
    font:inherit;
  }

  /* ===== DATE / AGEN ===== */
  .sign-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    margin-top: 10px;
  }
  .sign-row .place-date,
  .sign-row .agen {
    display:flex;
    align-items:end;
    gap:4px;
  }
  .sign-row .place-date input {
    width:220px;
  }
  .sign-row .agen input {
    width:160px;
  }

  /* ===== SIGNATURES ===== */
  .approvals {
    display: flex;
    justify-content: space-around;
    font-size: 11px;
    margin-top: 26px;
    text-align: center;
  }
  .approval-item {
    min-width: 150px;
  }
  .approval-role {
    display:block;
    margin-bottom:28px;
  }
  .signature-name {
    width:120px;
    border:0;
    border-bottom:1px solid #000;
    outline:0;
    background:transparent;
    text-align:center;
    font:inherit;
    padding:1px 3px;
  }

  /* ===== BANK ===== */
  .bank-section {
    display: flex;
    margin-top: 18px;
    font-size: 11px;
  }
  .bank-col { flex: 1; }
  .bank-col .bank-title {
    font-weight: bold;
    margin-bottom: 4px;
  }
  .bank-col table { border-collapse: collapse; }
  .bank-col td {
    padding: 1px 4px 1px 0;
    vertical-align: top;
  }
  .bank-col td.k { width: 90px; }
  .bank-col td.c { width: 12px; }

  .bank-edit {
    display:inline-block;
    min-width: 40px;
  }


  /* ===== PWA INSTALL BANNER (FLOATING BOTTOM CTA) ===== */
  @keyframes slideUpBanner {
    from {
      opacity: 0;
      transform: translate(-50%, 30px);
    }
    to {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  }

  .install-banner {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    width: min(92vw, 560px);
    background: rgba(17, 24, 39, 0.96);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.38);
    padding: 12px 16px;
    display: none;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    backdrop-filter: blur(10px);
  }
  .install-banner.show {
    display: flex;
    animation: slideUpBanner 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .install-banner-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: #1f2937;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .install-banner-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .install-banner .install-copy {
    flex: 1;
    min-width: 0;
  }
  .install-banner strong {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 2px;
    letter-spacing: 0.2px;
  }
  .install-banner span {
    display: block;
    font-size: 11px;
    color: #cbd5e1;
    line-height: 1.35;
  }
  .install-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .install-banner button {
    border: 0;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-weight: 700;
    font-size: 12px;
    transition: background 0.15s, transform 0.15s;
  }
  .install-main {
    background: #2563eb;
    color: #fff;
    box-shadow: 0 3px 10px rgba(37, 99, 235, 0.4);
  }
  .install-main:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
  }
  .install-close {
    background: rgba(255, 255, 255, 0.12);
    color: #cbd5e1;
  }
  .install-close:hover {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
  }

  /* ===== PRINT ===== */
  @media print {
    @page { size: A4 portrait; margin: 0; }
    html,body {
      min-width:0 !important;
      background:#fff !important;
      margin:0 !important;
      padding:0 !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .toolbar,
    .install-banner,
    .no-print,
    .aksi-col,
    .aksi-cell {
      display:none !important;
    }
    .page {
      width:210mm !important;
      margin:0 !important;
      padding:8mm !important;
      box-shadow:none !important;
    }
    .kwitansi + .kwitansi {
      page-break-inside: avoid;
    }
    .title-bar {
      background: #000 !important;
      color: #fff !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .editable-text:not(.title-bar),
    .field-input,
    .cell-input,
    .summary-input,
    .signature-name,
    .percent {
      background:transparent !important;
      box-shadow:none !important;
      outline:none !important;
    }
  }
</style>

  </div>
</div>

<div class="page">

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}
function rupiah(v){
  return new Intl.NumberFormat("id-ID",{maximumFractionDigits:0}).format(Math.round(Number(v)||0));
}
function parseNum(v){
  if(v===null || v===undefined || v==="") return 0;
  let s=String(v).trim().replace(/\s/g,"");
  if(s.includes(".") && s.includes(",")){
    const d=s.lastIndexOf("."), c=s.lastIndexOf(",");
    s = c>d ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"");
  }else{
    s=s.replace(/[.,](?=\d{3}(\D|$))/g,"").replace(",",".");
  }
  s=s.replace(/[^\d.-]/g,"");
  return Number(s)||0;
}

document.getElementById("receipt1").innerHTML = receiptTemplate(1);
document.getElementById("receipt2").innerHTML = receiptTemplate(2);

function root(n){ return document.getElementById("receipt"+n); }

function makeRow(n, data={}){
  const tr=document.createElement("tr");
  tr.innerHTML=`
    <td><input class="cell-input center rowno" value="${esc(data.no ?? "")}"></td>
    <td><input class="cell-input descInput" value="${esc(data.uraian ?? "")}"></td>
    <td><input class="cell-input num qtyInput" inputmode="decimal" value="${esc(data.qty ?? "")}"></td>
    <td><input class="cell-input num priceInput" inputmode="decimal" value="${esc(data.harga ?? "")}"></td>
    <td><input class="cell-input num totalInput" readonly></td>
    <td class="aksi-cell no-print"><button class="delete-row" onclick="deleteRow(${n},this)">Hapus</button></td>
  `;
  return tr;
}

function initRows(n,count=4){
  const tbody=root(n).querySelector(".items-body");
  tbody.innerHTML="";
  for(let i=0;i<count;i++) tbody.appendChild(makeRow(n,{no:i+1}));
  renumberRows(n);
  calculate(n);
}
function addRow(n,data=null){
  const tbody=root(n).querySelector(".items-body");
  if(tbody.children.length>=MAX_ROWS){
    flash(`Maksimal ${MAX_ROWS} baris agar layout tetap aman.`);
    return;
  }
  tbody.appendChild(makeRow(n,data||{no:tbody.children.length+1}));
  renumberRows(n); calculate(n); scheduleDraft();
}
function deleteRow(n,btn){
  const tbody=root(n).querySelector(".items-body");
  if(tbody.children.length<=1){ flash("Minimal 1 baris."); return; }
  btn.closest("tr").remove();
  renumberRows(n); calculate(n); scheduleDraft();
}
function clearRows(n){
  if(confirm(`Kosongkan semua baris Kwitansi ${n}?`)) initRows(n,4);
}
function renumberRows(n){
  root(n).querySelectorAll(".items-body tr").forEach((tr,i)=>{
    tr.querySelector(".rowno").value=i+1;
  });
}

function calculate(n){
  const r=root(n);
  let subtotal=0;
  r.querySelectorAll(".items-body tr").forEach(tr=>{
    const qty=parseNum(tr.querySelector(".qtyInput").value);
    const harga=parseNum(tr.querySelector(".priceInput").value);
    const total=qty*harga;
    subtotal+=total;
    tr.querySelector(".totalInput").value=total?rupiah(total):"";
  });

  const discPct=parseNum(r.querySelector(".discountPct").value);
  const ppnPct=parseNum(r.querySelector(".ppnPct").value);
  const discVal=subtotal*discPct/100;
  const after=subtotal-discVal;
  const ppnVal=after*ppnPct/100;
  const grand=after+ppnVal;

  r.querySelector(".sumTotal").value=rupiah(subtotal);
  r.querySelector(".discountVal").value=rupiah(discVal);
  r.querySelector(".afterDiscount").value=rupiah(after);
  r.querySelector(".ppnVal").value=rupiah(ppnVal);
  r.querySelector(".grandTotal").value=rupiah(grand);
}

function bind(n){
  const r=root(n);
  r.addEventListener("input", e=>{
    if(e.target.matches(".qtyInput,.priceInput,.discountPct,.ppnPct")) calculate(n);
    scheduleDraft();
  });
  r.addEventListener("blur", e=>{
    if(e.target.classList.contains("priceInput")){
      const v=parseNum(e.target.value);
      e.target.value=v?rupiah(v):"";
      calculate(n);
    }
  },true);
}

function collect(n){
  const r=root(n);
  const out={fields:{},texts:{},rows:[]};

  r.querySelectorAll(".field").forEach(el=>{
    out.fields[el.dataset.k]=el.value;
  });
  r.querySelectorAll(".dyn-text").forEach(el=>{
    out.texts[el.dataset.k]=el.innerText.trim();
  });
  r.querySelectorAll(".items-body tr").forEach(tr=>{
    out.rows.push({
      no:tr.querySelector(".rowno").value,
      uraian:tr.querySelector(".descInput").value,
      qty:tr.querySelector(".qtyInput").value,
      harga:tr.querySelector(".priceInput").value
    });
  });
  out.discount=r.querySelector(".discountPct").value;
  out.ppn=r.querySelector(".ppnPct").value;
  return out;
}

function apply(n,data){
  if(!data) return;
  const r=root(n);

  r.querySelectorAll(".field").forEach(el=>{
    el.value=data.fields?.[el.dataset.k] ?? "";
  });
  r.querySelectorAll(".dyn-text").forEach(el=>{
    const key=el.dataset.k;
    el.innerText=data.texts?.[key] ?? defaults[key] ?? "";
  });

  const tbody=r.querySelector(".items-body");
  tbody.innerHTML="";
  const rows=(data.rows?.length?data.rows:[{no:1}]).slice(0,MAX_ROWS);
  rows.forEach(x=>tbody.appendChild(makeRow(n,x)));

  r.querySelector(".discountPct").value=data.discount ?? "0";
  r.querySelector(".ppnPct").value=data.ppn ?? "11";
  renumberRows(n);
  calculate(n);
}

function copyReceipt(from,to){
  apply(to,collect(from));
  flash(`Kwitansi ${from} disalin ke Kwitansi ${to}.`);
}

function getDB(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]"); }
  catch { return []; }
}
function setDB(db){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
}

function saveRecord(){
  const record={
    id:currentId||("KW-"+Date.now()),
    updatedAt:new Date().toISOString(),
    r1:collect(1),
    r2:collect(2)
  };

  const db=getDB();
  const idx=db.findIndex(x=>x.id===record.id);
  if(idx>=0) db[idx]=record;
  else db.unshift(record);

  setDB(db);
  currentId=record.id;
  refreshRecords();
  document.getElementById("recordSelect").value=currentId;
  flash("Data tersimpan di localStorage.");
}

function refreshRecords(){
  const sel=document.getElementById("recordSelect");
  const old=sel.value;
  sel.innerHTML='<option value="">— Data tersimpan —</option>';

  getDB().forEach(x=>{
    const no=x.r1?.fields?.no||x.id;
    const nama=x.r1?.fields?.nama||"Tanpa nama";
    const opt=document.createElement("option");
    opt.value=x.id;
    opt.textContent=`${no} — ${nama}`;
    sel.appendChild(opt);
  });
  if([...sel.options].some(o=>o.value===old)) sel.value=old;
}

function loadSelected(){
  const id=document.getElementById("recordSelect").value;
  if(!id){ flash("Pilih data dulu."); return; }
  const x=getDB().find(v=>v.id===id);
  if(!x){ flash("Data tidak ditemukan."); return; }

  suppressDraft=true;
  currentId=id;
  apply(1,x.r1);
  apply(2,x.r2);
  suppressDraft=false;
  flash("Data dibuka.");
}

function deleteSelected(){
  const id=document.getElementById("recordSelect").value;
  if(!id){ flash("Pilih data yang ingin dihapus."); return; }
  if(!confirm("Hapus data kwitansi ini?")) return;

  setDB(getDB().filter(x=>x.id!==id));
  if(currentId===id) currentId=null;
  refreshRecords();
  flash("Data dihapus.");
}

function setToday(){
  const d=new Date();
  const yyyy=d.getFullYear();
  const mm=String(d.getMonth()+1).padStart(2,"0");
  const dd=String(d.getDate()).padStart(2,"0");
  const s=`${yyyy}-${mm}-${dd}`;
  root(1).querySelector('[data-k="tanggal"]').value=s;
  root(2).querySelector('[data-k="tanggal"]').value=s;
}

function resetAll(){
  if(!confirm("Reset kedua kwitansi? Data yang sudah disimpan tetap ada.")) return;
  suppressDraft=true;
  currentId=null;

  [1,2].forEach(n=>{
    initRows(n,4);
    root(n).querySelectorAll(".field").forEach(el=>el.value="");
    root(n).querySelectorAll(".dyn-text").forEach(el=>{
      el.innerText=defaults[el.dataset.k] ?? "";
    });
    root(n).querySelector(".discountPct").value="0";
    root(n).querySelector(".ppnPct").value="11";
    calculate(n);
  });

  setToday();
  localStorage.removeItem(DRAFT_KEY);
  document.getElementById("recordSelect").value="";
  suppressDraft=false;
  flash("Form direset.");
}

function scheduleDraft(){
  if(suppressDraft) return;
  clearTimeout(draftTimer);
  draftTimer=setTimeout(()=>{
    localStorage.setItem(DRAFT_KEY,JSON.stringify({r1:collect(1),r2:collect(2)}));
  },450);
}

function restoreDraft(){
  try{
    const raw=localStorage.getItem(DRAFT_KEY);
    if(!raw) return;
    if(confirm("Ada draft terakhir. Pulihkan?")){
      const d=JSON.parse(raw);
      suppressDraft=true;
      apply(1,d.r1);
      apply(2,d.r2);
      suppressDraft=false;
    }
  }catch{}
}

function flash(msg){
  const el=document.getElementById("status");
  el.textContent=msg;
  clearTimeout(window.__flash);
  window.__flash=setTimeout(()=>el.textContent="Siap.",2400);
}


/* ===== PWA / OFFLINE ===== */
let deferredInstallPrompt = null;
const installBanner = document.getElementById("installBanner");
const installMessage = document.getElementById("installMessage");
const toolbarInstallBtn = document.getElementById("toolbarInstallBtn");
const installBannerBtn = document.getElementById("installBannerBtn");

function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
function showInstallBanner(message, canInstall=true){
  if(localStorage.getItem("alfianInstallDismissed_v2")==="1") return;
  if(message) installMessage.textContent = message;
  installBanner.classList.add("show");
  installBannerBtn.style.display = canInstall ? "" : "none";
}
function dismissInstallBanner(){
  installBanner.classList.remove("show");
  localStorage.setItem("alfianInstallDismissed_v2","1");
}
async function installApp(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBanner.classList.remove("show");
    toolbarInstallBtn.style.display="none";
    if(choice.outcome==="accepted") flash("Aplikasi sedang dipasang ke layar utama.");
    return;
  }

  if(isIOS()){
    alert('Di iPhone/iPad: buka menu Share di Safari lalu pilih "Add to Home Screen" / "Tambahkan ke Layar Utama".');
  }else{
    alert("Untuk memasang aplikasi: buka menu browser (titik tiga di kanan atas) lalu pilih 'Pasang Aplikasi' atau 'Tambahkan ke Layar Utama'.");
  }
}

window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  toolbarInstallBtn.style.display="";
  showInstallBanner("Pasang ke layar utama agar bisa dibuka cepat langsung dari HP & bekerja offline.", true);
});

window.addEventListener("appinstalled", ()=>{
  deferredInstallPrompt=null;
  installBanner.classList.remove("show");
  toolbarInstallBtn.style.display="none";
  localStorage.removeItem("alfianInstallDismissed_v2");
  flash("Aplikasi berhasil dipasang.");
});

if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(console.error);
  });
}

function checkAndShowInstallBanner(){
  if(isStandalone()) return;
  setTimeout(()=>{
    if(isIOS()){
      showInstallBanner('Di iPhone/iPad: buka lewat Safari, tekan Share lalu pilih "Tambahkan ke Layar Utama".', false);
    }else{
      showInstallBanner('Setelah terpasang, aplikasi dapat dibuka cepat dari beranda HP & bekerja offline.', true);
    }
  }, 700);
}

if(document.readyState === "complete" || document.readyState === "interactive"){
  checkAndShowInstallBanner();
} else {
  window.addEventListener("load", checkAndShowInstallBanner);
}


initRows(1,4);
initRows(2,4);
bind(1);
bind(2);
setToday();
refreshRecords();
restoreDraft();
</script>
